name: Integrate recovery state
on:
  push:
    branches: [feat/error-recovery]
    paths: [.github/workflows/force-recovery-state.yml]
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/error-recovery}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('internal/presentation/projector.go'); s=p.read_text()
          s=s.replace('return p.append(FeedItem{Type: ItemError, ID: "err_" + strconv.Itoa(e.Seq), Seq: e.Seq, Text: e.Err})','return p.append(FeedItem{Type: ItemError, ID: "err_" + strconv.Itoa(e.Seq), Seq: e.Seq, Text: e.Err, Error: ErrorCardFromEvent(e)})')
          s=s.replace('return p.append(FeedItem{Type: ItemError, ID: "intr_" + strconv.Itoa(e.Seq), Seq: e.Seq, Text: text})','return p.append(FeedItem{Type: ItemError, ID: "intr_" + strconv.Itoa(e.Seq), Seq: e.Seq, Text: text, Error: NewErrorCard(agent.ErrCanceled, text, "")})')
          p.write_text(s)
          p=Path('internal/presentation/status.go'); s=p.read_text()
          s=re.sub(r'type ErrorCode string\n\nconst \([\s\S]*?\n\)\n\n(?=type PresentedError)', '', s, count=1)
          s=s.replace('Code      ErrorCode','Code      agent.ErrorCode')
          s=re.sub(r'case agent.Interrupted:\n[\s\S]*?\tcase agent.RunEnd:', '''case agent.Interrupted:
		p.status.Phase = PhaseIdle
		p.status.CanCancel = false
		p.status.LastError = &PresentedError{Code: agent.ErrCanceled, Message: "run canceled"}
	case agent.RunError:
		card := ErrorCardFromEvent(e)
		p.status.LastError = &PresentedError{Code: card.Code, Message: card.Message, Retryable: card.Retryable}
		p.status.CanRetry = card.RetryScope == RetryProviderTurn
		switch card.Code {
		case agent.ErrBudget, agent.ErrMaxTurnsCode:
			p.status.Phase = PhaseEnded
		case agent.ErrCanceled:
			p.status.Phase = PhaseIdle
		default:
			p.status.Phase = PhaseError
		}
	case agent.RunEnd:''', s, count=1)
          p.write_text(s)
          p=Path('internal/agent/loop.go'); s=p.read_text()
          s=s.replace('if l.SpendBudget != nil && l.SpendBudget.Exhausted() {\n\t\treturn ErrSpendBudget\n\t}', 'if l.SpendBudget != nil && l.SpendBudget.Exhausted() {\n\t\t_ = l.emit(RunErrorEvent(ErrSpendBudget))\n\t\treturn ErrSpendBudget\n\t}',1)
          s=s.replace('_ = l.emit(Event{Type: RunError, Err: ErrRateLimitBudget.Error()})','_ = l.emit(RunErrorEvent(ErrRateLimitBudget))')
          p.write_text(s)
          p=Path('internal/ui/feed.go'); s=p.read_text()
          if 'recoveryError *presentation.ErrorCard' not in s: s=s.replace('errorSeenSinceSend bool','errorSeenSinceSend bool\n\trecoveryError *presentation.ErrorCard',1)
          s=s.replace('m.addNotice(presentation.ItemError, errSummary(msg.err))','m.addRuntimeError(msg.err)')
          s=s.replace('case agent.RunError:\n\t\tm.errorSeenSinceSend = true','case agent.RunError:\n\t\tm.errorSeenSinceSend = true\n\t\tm.recoveryError = presentation.ErrorCardFromEvent(e)',1)
          p.write_text(s)
          p=Path('internal/ui/feed_input.go'); s=p.read_text(); a='\tif m.modalVisible || m.decisionPending {\n\t\treturn m.modalKey(k)\n\t}\n'
          if 'm.recoveryKey(k)' not in s: s=s.replace(a,a+'\tif m.recoveryError != nil && !m.running && !m.busy {\n\t\tif model, cmd, handled := m.recoveryKey(k); handled { return model, cmd }\n\t}\n',1)
          p.write_text(s)
          PY
          cat > internal/ui/recovery.go <<'EOF'
          package ui

          import (
            "context"
            "strconv"
            "nabd/internal/presentation"
            tea "github.com/charmbracelet/bubbletea"
          )

          type providerRetryRunner interface { RetryProvider(context.Context) error }

          func (m *Feed) addRuntimeError(err error) {
            card := presentation.ErrorCardFromError(err)
            m.recoveryError = card
            m.notices = append(m.notices, presentation.FeedItem{Type: presentation.ItemError, ID: "runtime_error_" + strconv.Itoa(len(m.notices)+1), Seq: m.lastSeq, Text: errSummary(err), Error: card})
            m.refresh()
            if m.follow { m.scrollToEnd() }
          }

          func (m *Feed) recoveryKey(k tea.KeyMsg) (tea.Model, tea.Cmd, bool) {
            switch k.String() {
            case "d", "D", "esc":
              m.recoveryError = nil; return m, nil, true
            case "n", "N":
              if m.recoveryError.RetryScope == presentation.RetryNewMessage { m.recoveryError = nil; m.composer.focus(); return m, nil, true }
            case "c", "C":
              if m.callbacks.OnCtx != nil { m.setCommandResult(m.callbacks.OnCtx()) }; return m, nil, true
            case "r", "R":
              if m.recoveryError.RetryScope != presentation.RetryProviderTurn { return m, nil, true }
              retry, ok := m.runner.(providerRetryRunner)
              if !ok { m.status = "provider retry is unavailable"; return m, nil, true }
              ctx, cancel := context.WithCancel(context.Background())
              m.cancel = cancel; m.running = true; m.busy = true; m.errorSeenSinceSend = false; m.recoveryError = nil; m.status = "retry pending"
              return m, func() tea.Msg { err := retry.RetryProvider(ctx); cancel(); return doneMsg{err} }, true
            }
            return m, nil, false
          }
          EOF
          gofmt -w internal/agent internal/provider internal/presentation internal/store internal/ui
          rm .github/workflows/force-recovery-state.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'feat(errors): wire recovery state and safe retry' && git push
          go test ./...
          go test -race ./internal/agent ./internal/provider ./internal/presentation ./internal/ui
          go vet ./...
