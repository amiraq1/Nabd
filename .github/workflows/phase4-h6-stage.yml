name: Stage phase 4 H6
on:
  push:
    branches: [fix/phase4-aggregate-diff-budget]
permissions:
  contents: write
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/phase4-aggregate-diff-budget
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Apply without precommit test
        run: |
          awk '/- name: Apply and test/{f=1; next} f && /        run: \|/{next} f && /          go test/{exit} f{sub(/^          /, ""); print}' .github/workflows/phase4-h6-apply.yml > /tmp/apply-h6.sh
          bash /tmp/apply-h6.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/tools docs/TECH_DEBT.md docs/THREAT_MODEL.md
          git commit -m "fix(tools): enforce aggregate diff memory budget"
          git push origin HEAD:fix/phase4-aggregate-diff-budget
