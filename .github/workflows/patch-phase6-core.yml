name: Patch phase six core
on:
  push:
    branches: [feat/accessibility-visual-system]
    paths: [.github/workflows/patch-phase6-core.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accessibility-visual-system
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('internal/ui/render.go'); s=p.read_text()
          pat=r'var \(\n\tdim[\s\S]*?\n\)\n\n// AllowedUISymbols'
          rep='''var activeTheme = newSemanticTheme(noColorRequested())

var (
\tdim = activeTheme.Dim
\tbold = activeTheme.Bold
\tgood = activeTheme.Success
\tbad = activeTheme.Error
\twarn = activeTheme.Warning
\tgreen = activeTheme.Success
\tuserCardStyle = activeTheme.UserCard
\tuserRoleStyle = activeTheme.UserRole
)

// AllowedUISymbols'''
          s,n=re.subn(pat,rep,s,count=1)
          if n!=1: raise SystemExit('theme anchor not found')
          s=s.replace('return c.Name + " " + a','return c.Name + " " + formatCodeSpan(a)',1)
          p.write_text(s)
          p=Path('internal/ui/feed_render.go'); s=p.read_text().replace('head += " " + truncate(toolSummaryText(p.Args), width/3)','head += " " + truncate(formatCodeSpan(p.Args), width/3)',1); p.write_text(s)
          PY
          gofmt -w internal/ui
          rm -f .github/workflows/apply-phase6.yml .github/workflows/patch-phase6-core.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'feat(ui): integrate semantic accessible theme' && git push
