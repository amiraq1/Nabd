name: Config v2 debug

on:
  pull_request:
    branches: [master]

jobs:
  gofmt-v2-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: test -z "$(gofmt -l .)"

  build-v2-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go build ./...

  vet-v2-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go vet ./...

  unit-v2-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go test ./... -count=1

  nested-v2-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - working-directory: third_party/bubbles
        run: go test ./... -count=1

  staticcheck-v2-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: "$(go env GOPATH)/bin/staticcheck" ./...
