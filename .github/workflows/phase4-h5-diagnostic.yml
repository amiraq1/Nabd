name: Diagnose phase 4 H5
on:
  push:
    branches: [ci/phase4-windows-compile-only]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ci/phase4-windows-compile-only
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Capture diagnostic
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./... > docs/windows-build-diagnostic.txt 2>&1 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/windows-build-diagnostic.txt
          git commit -m "ci: capture Windows build diagnostic"
          git push origin HEAD:ci/phase4-windows-compile-only
