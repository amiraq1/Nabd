name: Go Tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Environment diagnostics
        run: go env GOOS GOARCH CGO_ENABLED CC
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test with Race Detector
        run: go test ./... -race -count=1
      - name: Router intensive race test
        run: go test ./internal/provider/... -run Router -race -count=100
      - name: Exec.Cmd.Env static audit
        run: bash scripts/check-exec-env.sh
      - name: Install pinned staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          export PATH="$(go env GOPATH)/bin:$PATH"
          staticcheck -version
          staticcheck ./...
