name: Apply phase seven
on:
  push:
    branches: [feat/ui-performance-stability]
    paths: [.github/workflows/apply-phase7.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-performance-stability
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/ui/feed.go'); s=p.read_text()
          s=s.replace('\trenderSigValid bool\n','\trenderSigValid bool\n\trefreshing     bool\n\trefreshPending bool\n\trefreshPasses  int\n',1)
          p.write_text(s)
          p=Path('internal/ui/feed_layout.go'); s=p.read_text()
          old='func (m *Feed) refresh() bool {'
          wrapper='''func (m *Feed) refresh() bool {
\tif m.refreshing {
\t\tm.refreshPending = true
\t\treturn false
\t}
\tdirty := false
\tfor {
\t\tm.refreshPending = false
\t\tm.refreshing = true
\t\tchanged := m.refreshPass()
\t\tm.refreshing = false
\t\tdirty = dirty || changed
\t\tif !m.refreshPending {
\t\t\treturn dirty
\t\t}
\t}
}

func (m *Feed) refreshPass() bool {'''
          if old not in s: raise SystemExit('refresh anchor missing')
          s=s.replace(old,wrapper,1)
          s=s.replace('\tm.lines = renderItemsCached(m, items, m.width, m.toolsExpanded)\n','\tm.lines = boundRenderedLines(renderItemsCached(m, items, m.width, m.toolsExpanded), maxRenderedFeedLines)\n\tm.refreshPasses++\n',1)
          old='''\tm.width = msg.Width
\tif m.width < minViewportWidth {
\t\tm.width = minViewportWidth
\t}
\tm.height = msg.Height
\tif m.height < 1 {
\t\tm.height = 1
\t}
'''
          new='''\tnextWidth := msg.Width
\tif nextWidth < minViewportWidth {
\t\tnextWidth = minViewportWidth
\t}
\tnextHeight := msg.Height
\tif nextHeight < 1 {
\t\tnextHeight = 1
\t}
\tif nextWidth == m.width && nextHeight == m.height {
\t\treturn m, nil
\t}
\tm.width = nextWidth
\tm.height = nextHeight
'''
          if old not in s: raise SystemExit('resize anchor missing')
          s=s.replace(old,new,1); p.write_text(s)
          p=Path('internal/ui/phase7_performance_test.go'); s=p.read_text().replace('agent.AssistantText','agent.TextDelta'); p.write_text(s)
          PY
          gofmt -w internal/ui
          rm .github/workflows/apply-phase7.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'feat(ui): coalesce refreshes and bound retained lines' && git push
