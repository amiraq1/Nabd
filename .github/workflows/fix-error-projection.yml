name: Finalize error projection
on:
  push:
    branches: [feat/error-recovery]
    paths: [.github/workflows/fix-error-projection.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/error-recovery
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/presentation/projector.go')
          s=p.read_text()
          s=s.replace('return p.append(FeedItem{Type: ItemError, ID: "err_" + strconv.Itoa(e.Seq), Seq: e.Seq, Text: e.Err})','return p.append(FeedItem{Type: ItemError, ID: "err_" + strconv.Itoa(e.Seq), Seq: e.Seq, Text: e.Err, Error: ErrorCardFromEvent(e)})')
          s=s.replace('return p.append(FeedItem{Type: ItemError, ID: "intr_" + strconv.Itoa(e.Seq), Seq: e.Seq, Text: text})','return p.append(FeedItem{Type: ItemError, ID: "intr_" + strconv.Itoa(e.Seq), Seq: e.Seq, Text: text, Error: NewErrorCard(agent.ErrCanceled, text, "")})')
          p.write_text(s)
          PY
          gofmt -w internal/presentation/projector.go
          rm -f .github/workflows/fix-error-projection.yml .github/workflows/force-recovery-state.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(errors): project typed cards for live and replay'
          git push
          go test ./...
          go test -race ./internal/agent ./internal/provider ./internal/presentation ./internal/ui
          go vet ./...
