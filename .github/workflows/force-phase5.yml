name: Force phase five integration
on:
  push:
    branches: [feat/commands-navigation]
    paths: [.github/workflows/force-phase5.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feat/commands-navigation}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/ui/slash_commands.go'); s=p.read_text()
          for a,b in [('undo file edits recorded in the journal','undo recorded file edits'),('rewind conversation turns and restore prompt','cut conversation turns; files are unchanged'),('show context window token usage','show context and spend status'),('compact conversation history in background','compact history; journal file is preserved'),('list pending reversible file edits','list reversible file edits')]: s=s.replace(a,b)
          old='''\tif len(f) > 1 {
\t\tif v, err := strconv.Atoi(f[1]); err == nil && v > 0 {
\t\t\tres.N = v
\t\t\tres.HasN = true
\t\t}
\t}
'''; new='''\tif len(f) > 1 {
\t\tif !cmd.HasArg || len(f) != 2 { res.Valid = false; res.Error = "usage: " + cmd.Usage; return res }
\t\tv, err := strconv.Atoi(f[1])
\t\tif err != nil || v <= 0 { res.Valid = false; res.Error = "usage: " + cmd.Usage; return res }
\t\tres.N = v; res.HasN = true
\t}
'''
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('internal/ui/feed.go'); s=p.read_text()
          if 'selectedItem int' not in s: s=s.replace('\ttoolsExpanded bool\n','\ttoolsExpanded bool\n\tselectedItem int\n\tnavigationMode bool\n',1)
          if 'selectedItem: -1' not in s: s=s.replace('\t\tfollow:     true,\n','\t\tfollow:     true,\n\t\tselectedItem: -1,\n',1)
          p.write_text(s)
          p=Path('internal/ui/feed_input.go'); s=p.read_text()
          a='\tif m.menu.visible {\n\t\treturn m.menuKey(k)\n\t}\n'
          if 'm.navigationKey(k)' not in s: s=s.replace(a,a+'\tif m.navigationMode { if model, cmd, handled := m.navigationKey(k); handled { return model, cmd } }\n',1)
          a='func (m *Feed) composerKey(k tea.KeyMsg) (tea.Model, tea.Cmd) {\n\tswitch {\n'
          if 'm.enterNavigation()' not in s: s=s.replace(a,'func (m *Feed) composerKey(k tea.KeyMsg) (tea.Model, tea.Cmd) {\n\tif k.Type == tea.KeyEsc && m.composer.isEmpty() { m.enterNavigation(); return m, nil }\n\tswitch {\n',1)
          s=s.replace('\t\tm.status = "/undo [n] · /edits · /ctx · /compact · /rewind [n]"','\t\tm.setCommandResult(CommandHelp(m.width))')
          s=s.replace('completed := cmd.Name + " "','completed := cmd.Name\n\t\t\tif cmd.HasArg { completed += " " }')
          p.write_text(s)
          p=Path('internal/ui/chat.go'); s=p.read_text(); s=s.replace('return "/undo [n] · /edits · /rewind [n] · /ctx · /compact · ctrl+c · ctrl+d"','return CommandHelp(m.width)'); p.write_text(s)
          p=Path('internal/ui/phase5_navigation_test.go'); s=p.read_text()
          if 'github.com/charmbracelet/x/ansi' not in s: s=s.replace('"nabd/internal/agent"','"nabd/internal/agent"\n\n\t"github.com/charmbracelet/x/ansi"')
          s=s.replace('displayWidth(line)','ansi.StringWidth(line)'); p.write_text(s)
          PY
          gofmt -w internal/ui
          rm -f .github/workflows/apply-phase5.yml .github/workflows/force-phase5.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'feat(ui): improve commands and feed navigation' && git push
          go test ./...
          go test -race ./internal/presentation ./internal/ui
          go vet ./...
