name: Apply phase 4 H5 v2
on:
  push:
    branches: [ci/phase4-windows-compile-only]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ci/phase4-windows-compile-only
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Apply platform shims and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('internal/tools/bash.go'); s=p.read_text()
          s=s.replace('cmd.SysProcAttr = &syscall.SysProcAttr{Setpgid: true}', 'configureProcessGroup(cmd)', 1)
          start=s.index('// killGroup addresses -pgid')
          end=s.index('// childEnvAllowlist', start)
          s=s[:start]+s[end:]
          p.write_text(s)

          p=Path('internal/ui/touch.go'); s=p.read_text()
          s=s.replace('\n\t"golang.org/x/sys/unix"', '', 1)
          old='''\t\t\t\tpollFds := []unix.PollFd{{Fd: int32(fd), Events: unix.POLLIN}}
\t\t\t\ttimeoutMs := int(n.escTimeout.Milliseconds())
\t\t\t\tif timeoutMs <= 0 {
\t\t\t\t\ttimeoutMs = 25
\t\t\t\t}
\t\t\t\tnReady, _ := unix.Poll(pollFds, timeoutMs)
\t\t\t\tif nReady <= 0 {'''
          new='''\t\t\t\tif !inputReady(fd, n.escTimeout) {'''
          if old not in s: raise SystemExit('touch poll marker missing')
          p.write_text(s.replace(old,new,1))

          note='// Windows compatibility shim: compile-tested in CI; Windows remains an unsupported runtime target.\n'
          for name in ['internal/snap/rename_windows.go','internal/snap/sync_windows.go','internal/config/open_windows.go','internal/config/owner_other.go']:
            p=Path(name); s=p.read_text(); marker=s.find('\n\n')
            if note not in s: p.write_text(s[:marker+2]+note+s[marker+2:])

          p=Path('.github/workflows/ci.yml'); s=p.read_text(); marker='          - { goos: android, goarch: arm64, vet: true }'
          if 'goos: windows' not in s: s=s.replace(marker, marker+'\n          - { goos: windows, goarch: amd64, vet: false }',1)
          p.write_text(s)
          PY
          cat > internal/tools/process_group_unix.go <<'EOF'
          //go:build !windows

          package tools

          import (
            "os/exec"
            "syscall"
            "time"
          )

          func configureProcessGroup(cmd *exec.Cmd) {
            cmd.SysProcAttr = &syscall.SysProcAttr{Setpgid: true}
          }

          func killGroup(pgid int) {
            if pgid <= 1 { return }
            syscall.Kill(-pgid, syscall.SIGTERM)
            deadline := time.Now().Add(bashTermGrace)
            for time.Now().Before(deadline) {
              if syscall.Kill(-pgid, 0) != nil { return }
              time.Sleep(25 * time.Millisecond)
            }
            syscall.Kill(-pgid, syscall.SIGKILL)
          }
          EOF
          cat > internal/tools/process_group_windows.go <<'EOF'
          //go:build windows

          package tools

          import (
            "os"
            "os/exec"
          )

          // Windows is compile-tested only and remains an unsupported runtime.
          func configureProcessGroup(cmd *exec.Cmd) {}
          func killGroup(pid int) {
            if pid <= 0 { return }
            if p, err := os.FindProcess(pid); err == nil { _ = p.Kill() }
          }
          EOF
          cat > internal/ui/poll_unix.go <<'EOF'
          //go:build !windows

          package ui

          import (
            "time"
            "golang.org/x/sys/unix"
          )

          func inputReady(fd uintptr, timeout time.Duration) bool {
            timeoutMs := int(timeout.Milliseconds())
            if timeoutMs <= 0 { timeoutMs = 25 }
            fds := []unix.PollFd{{Fd: int32(fd), Events: unix.POLLIN}}
            ready, _ := unix.Poll(fds, timeoutMs)
            return ready > 0
          }
          EOF
          cat > internal/ui/poll_windows.go <<'EOF'
          //go:build windows

          package ui

          import "time"

          // Windows is compile-tested only and remains an unsupported runtime.
          func inputReady(fd uintptr, timeout time.Duration) bool { return true }
          EOF
          gofmt -w internal/tools/bash.go internal/tools/process_group_*.go internal/ui/touch.go internal/ui/poll_*.go internal/snap/*_windows.go internal/config/open_windows.go internal/config/owner_other.go
          go test ./internal/tools ./internal/ui
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml internal/tools internal/ui internal/snap/rename_windows.go internal/snap/sync_windows.go internal/config/open_windows.go internal/config/owner_other.go
          git commit -m "ci: compile-test unsupported Windows shims"
          git push origin HEAD:ci/phase4-windows-compile-only
