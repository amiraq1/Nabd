name: Apply phase 4 hygiene v2
on:
  push:
    branches: [chore/phase4-code-hygiene]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/phase4-code-hygiene
      - name: Apply changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/tools/grep.go'); s=p.read_text(); s=s.replace('"fmt"\n\t"io/fs"','"fmt"\n\t"io"\n\t"io/fs"').replace('return 0, fmt.Errorf("EOF")','return 0, io.EOF'); p.write_text(s)
          p=Path('internal/tools/write_commit.go'); s=p.read_text().replace('\t"path/filepath"\n','').replace('if err := os.MkdirAll(filepath.Dir(abs), 0o755); err != nil {','if err := mkdirParentDirs(abs); err != nil {'); p.write_text(s)
          p=Path('internal/tools/write_diff.go'); s=p.read_text().replace('"strings"\n)','"strings"\n\t"sync"\n)').replace('var (\n\t// maxDiffLines','var diffWorkMu sync.Mutex\n\nvar (\n\t// maxDiffLines'); needle='\t// LCS table for the two line sequences. Cancellation is checked once per\n'; insert='\t// Serialize matrix allocation across calls so maxDiffCells is an aggregate process ceiling.\n\tdiffWorkMu.Lock()\n\tdefer diffWorkMu.Unlock()\n\tif err := ctx.Err(); err != nil { return "", err }\n\n'; s=s.replace(needle,insert+needle); p.write_text(s)
          p=Path('internal/provider/router.go'); s=p.read_text().replace('KNOWN_LIMITATION_CIRCUIT_BREAKER: NOT_IMPLEMENTED (P section)','CIRCUIT_BREAKER: IMPLEMENTED — 401/403 opens only that route for a five-minute cooldown; the next request after expiry is the half-open probe'); p.write_text(s)
          for name in ['internal/snap/rename_windows.go','internal/snap/sync_windows.go','internal/config/open_windows.go','internal/config/owner_other.go']:
            p=Path(name); s=p.read_text(); note='// Windows compatibility shim: compiled in CI, but Windows is not a supported runtime target.\n'; i=s.find('\n\n');
            if note not in s: s=s[:i+2]+note+s[i+2:]
            p.write_text(s)
          p=Path('.github/workflows/ci.yml'); s=p.read_text(); a='          - { goos: android, goarch: arm64, vet: true }'; s=s.replace(a,a+'\n          - { goos: windows, goarch: amd64, vet: false }'); p.write_text(s)
          PY
          cat > internal/tools/mkdir_mode.go <<'EOF'
          package tools

          import (
            "fmt"
            "os"
            "path/filepath"
          )

          // mkdirParentDirs inherits the nearest existing parent directory mode.
          func mkdirParentDirs(abs string) error {
            target := filepath.Dir(abs)
            if fi, err := os.Stat(target); err == nil {
              if !fi.IsDir() { return fmt.Errorf("parent is not a directory: %s", target) }
              return nil
            } else if !os.IsNotExist(err) { return err }
            ancestor := target
            for {
              parent := filepath.Dir(ancestor)
              fi, err := os.Stat(parent)
              if err == nil {
                if !fi.IsDir() { return fmt.Errorf("ancestor is not a directory: %s", parent) }
                mode := fi.Mode().Perm(); if mode == 0 { mode = 0o755 }
                return os.MkdirAll(target, mode)
              }
              if !os.IsNotExist(err) { return err }
              if parent == ancestor { return os.MkdirAll(target, 0o755) }
              ancestor = parent
            }
          }
          EOF
          cat > internal/tools/hygiene_test.go <<'EOF'
          package tools

          import (
            "io"
            "os"
            "path/filepath"
            "testing"
          )

          func TestMkdirParentDirsInheritsPrivateParentMode(t *testing.T) {
            root:=t.TempDir(); private:=filepath.Join(root,"private")
            if err:=os.Mkdir(private,0o700); err!=nil { t.Fatal(err) }
            target:=filepath.Join(private,"a","b","file.txt")
            if err:=mkdirParentDirs(target); err!=nil { t.Fatal(err) }
            for _,dir:=range []string{filepath.Join(private,"a"),filepath.Join(private,"a","b")} { fi,err:=os.Stat(dir); if err!=nil { t.Fatal(err) }; if got:=fi.Mode().Perm(); got!=0o700 { t.Fatalf("%s mode=%04o, want 0700",dir,got) } }
          }
          func TestLimitedReaderUsesIOEOF(t *testing.T) {
            f,err:=os.CreateTemp(t.TempDir(),"empty"); if err!=nil { t.Fatal(err) }; defer f.Close()
            r:=&limitedReader{f:f,left:0}; _,err=r.Read(make([]byte,1)); if err!=io.EOF { t.Fatalf("error=%v, want io.EOF",err) }
          }
          EOF
          rm -f .github/workflows/go-checks.yml .github/workflows/phase4-apply.yml
          gofmt -w internal/tools internal/provider/router.go internal/snap/*_windows.go internal/config/open_windows.go internal/config/owner_other.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: complete phase 4 code hygiene"
          git push origin HEAD:chore/phase4-code-hygiene
