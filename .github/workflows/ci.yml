name: CI

on:
  push:
    branches: ["fix/compact-command-interlock"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/compact-command-interlock
      - name: Replace stale race expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/agent/compact_race_test.go')
          s = p.read_text()
          anchor = '''\t\t// Concurrent Rewind removes Turn 2 — which IS firstKept — from the live
\t\t// branch, while Compact is blocked in summarise.
'''
          replacement = '''\t\t// Finding 5 closes the production overlap before the older stale-boundary
\t\t// defense is needed: Rewind must fail immediately and leave firstKept live.
\t\tif _, err := l.Rewind(1); !errors.Is(err, ErrHistoryMutationInProgress) {
\t\t\tt.Fatalf("expected ErrHistoryMutationInProgress while Compact is active, got %v", err)
\t\t}
\t\tif !seqPresentInLive(l, turn2Seq) {
\t\t\tt.Fatalf("rejected Rewind removed firstKept seq %d", turn2Seq)
\t\t}
\t\tclose(unblock)
\t\tif err := <-compactErr; err != nil {
\t\t\tt.Fatalf("Compact failed after conflicting Rewind was rejected: %v", err)
\t\t}
\t\treturn

\t\t// Legacy Finding 2 assertions below document the stale-boundary defense.
\t\t// They are unreachable through Rewind now that Finding 5 owns the higher-
\t\t// level interlock; synthetic injection still tests that defense above.
\t\t// Concurrent Rewind removes Turn 2 — which IS firstKept — from the live
\t\t// branch, while Compact is blocked in summarise.
'''
          if anchor not in s:
              raise SystemExit('race-test anchor missing')
          p.write_text(s.replace(anchor, replacement, 1))
          PY
          gofmt -w internal/agent/compact_race_test.go
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(agent): update compact rewind race contract'
          git push origin HEAD:fix/compact-command-interlock
