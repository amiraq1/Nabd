name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
        check-latest: true
        
    - name: Build
      run: go build ./...
      
    - name: Vet
      run: go vet ./...
      
    - name: Test
      run: go test ./... -race
      
    - name: Exec.Cmd.Env static audit
      run: bash scripts/check-exec-env.sh

    - name: Staticcheck
      # GOTOOLCHAIN=local pins parser to installed go 1.27 toolchain.
      # v0.8.1 is pinned; matches test.yml to prevent version drift.
      run: GOTOOLCHAIN=local go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      
    - name: Clean Clone Build Test
      run: |
        tmp=$(mktemp -d)
        git archive HEAD | tar -x -C "$tmp"
        cd "$tmp"
        go build ./...
        go test ./... -race
