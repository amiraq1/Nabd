name: CI

on:
  push:
    branches: [ "master", "main", "feature/**", "fix/**", "docs/**" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.1'
        check-latest: true

    - name: Environment diagnostics
      run: go env GOOS GOARCH CGO_ENABLED CC

    - name: Threat model freshness guard tests
      run: bash scripts/test-threat-model-freshness.sh

    - name: Threat model freshness
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: bash scripts/check-threat-model-freshness.sh "$BASE_SHA"

    - name: Check formatting (gofmt)
      run: test -z "$(gofmt -l .)"

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Unit tests without race
      run: go test ./... -count=1

    - name: Nested bubbles unit tests
      working-directory: third_party/bubbles
      run: go test ./... -count=1

    - name: Install pinned staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
        export PATH="$(go env GOPATH)/bin:$PATH"
        staticcheck -version
        staticcheck ./...

    - name: Race detector on all packages
      run: go test ./... -race -count=1

    - name: Nested bubbles race tests
      working-directory: third_party/bubbles
      run: go test ./... -race -count=1

    - name: Router intensive race test
      run: go test ./internal/provider/... -run Router -race -count=100

    - name: Agent intensive race test
      run: go test ./internal/agent/... -run 'Router|Replay|Messages|ToolCall|Compact' -race -count=50

    # Reduced to -count=20 because -race overhead on GH Actions makes the UI tests easily exceed the 15m job timeout even with optimized test payloads.
    - name: UI and Presentation intensive race test
      run: go test ./internal/ui/... ./internal/presentation/... -race -count=20

    - name: UI row-accounting contract test
      run: go test ./internal/ui/ -run 'Contract|RowAccounting|FrameHeight|BottomAnchor' -count=1

    - name: UI rendering and streaming benchmarks
      run: go test ./internal/ui/ -run '^$' -bench '^(BenchmarkRefreshStreaming|BenchmarkFormatInlineLong|BenchmarkFormatMarkdown|BenchmarkViewFullScreen)$' -benchmem -count=1

    - name: UI layout benchmark baseline (non-gating)
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        go test ./internal/ui/ -run '^$' \
          -bench '^(BenchmarkRenderItems500|BenchmarkFormatInlineLong|BenchmarkFormatMarkdownLong|BenchmarkViewFullScreen)$' \
          -benchmem -benchtime=10x -count=5 2>&1 | tee bench-ui.txt

    - name: Upload benchmark artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bench-ui-${{ github.sha }}
        path: bench-ui.txt
        if-no-files-found: warn

    - name: Exec.Cmd.Env static audit
      run: bash scripts/check-exec-env.sh

    - name: Git diff check
      run: git diff --check

    - name: Clean local clone verification
      run: |
        tmp=$(mktemp -d)
        git clone --no-local . "$tmp/nabd"
        cd "$tmp/nabd"
        go build ./...
        go test ./... -race -count=1
        rm -rf "$tmp"

  # Catches build-tagged files (owner_other.go and friends) that the
  # ubuntu-only job never compiles.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            vet: true
          - goos: linux
            goarch: arm64
            vet: true
          - goos: darwin
            goarch: amd64
            vet: true
          - goos: darwin
            goarch: arm64
            vet: true
          - goos: android
            goarch: arm64
            vet: true
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.1'
        check-latest: true

    - name: Cross-compile
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build ./...

    - name: Vet
      if: ${{ matrix.vet }}
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go vet ./...
