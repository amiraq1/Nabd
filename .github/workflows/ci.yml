name: CI

on:
  push:
    branches: [ "master", "main", "feature/**" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
        check-latest: true

    - name: Environment diagnostics
      run: go env GOOS GOARCH CGO_ENABLED CC

    - name: Check formatting (gofmt)
      run: test -z "$(gofmt -l .)"

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Unit tests without race
      run: go test ./... -count=1

    - name: Install pinned staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
        export PATH="$(go env GOPATH)/bin:$PATH"
        staticcheck -version
        staticcheck ./...

    - name: Race detector on all packages
      run: go test ./... -race -count=1

    - name: Router intensive race test
      run: go test ./internal/provider/... -run Router -race -count=100

    - name: Agent intensive race test
      run: go test ./internal/agent/... -run 'Router|Replay|Messages|ToolCall' -race -count=50

    - name: Exec.Cmd.Env static audit
      run: bash scripts/check-exec-env.sh

    - name: Git diff check
      run: git diff --check

    - name: Clean local clone verification
      run: |
        tmp=$(mktemp -d)
        git clone --no-local . "$tmp/nabd"
        cd "$tmp/nabd"
        go build ./...
        go test ./... -race -count=1
        rm -rf "$tmp"
