name: CI

on:
  push:
    branches: [ "master", "main", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

    - name: Apply Finding 5 patch
      if: github.event_name == 'push' && github.ref_name == 'fix/compact-command-interlock'
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        p = Path('internal/agent/loop.go')
        s = p.read_text()
        old = '\tmu     sync.Mutex\n\tseq    int\n\tparent int\n\thist   []Event\n'
        new = '\tmu        sync.Mutex\n\thistoryMu sync.Mutex\n\tseq       int\n\tparent    int\n\thist      []Event\n'
        if old not in s: raise SystemExit('Loop mutex anchor missing')
        s = s.replace(old, new, 1)
        anchor = 'var ErrCompactBoundaryStale = errors.New("compact boundary became unsafe; concurrent turn invalidated the projection")\n'
        addition = anchor + '\n// ErrHistoryMutationInProgress means Compact or Rewind already owns the\n// history-mutation interlock. Callers should retry after the active operation\n// settles; waiting inside either operation would freeze an interactive command.\nvar ErrHistoryMutationInProgress = errors.New("history mutation already in progress; wait for compact or rewind to finish")\n'
        if anchor not in s: raise SystemExit('compact sentinel anchor missing')
        p.write_text(s.replace(anchor, addition, 1))
        p = Path('internal/agent/compact.go')
        s = p.read_text()
        old = 'func (l *Loop) Compact(ctx context.Context, target int) error {\n\t// Phase 1: take a snapshot of the live branch to pick a boundary.\n\t// l.mu is held only briefly so that the provider call does not block it.\n\tl.mu.Lock()\n\tlive := Live(l.hist)\n\tl.mu.Unlock()\n'
        new = 'func (l *Loop) Compact(ctx context.Context, target int) error {\n\tif !l.historyMu.TryLock() {\n\t\treturn ErrHistoryMutationInProgress\n\t}\n\tdefer l.historyMu.Unlock()\n\n\t// Phase 1: take a snapshot of the live branch to pick a boundary.\n\t// l.mu is held only briefly so that the provider call does not block it.\n\tl.mu.Lock()\n\tlive := Live(l.hist)\n\tl.mu.Unlock()\n'
        if old not in s: raise SystemExit('Compact entry anchor missing')
        p.write_text(s.replace(old, new, 1))
        p = Path('internal/agent/rewind.go')
        s = p.read_text()
        old = 'func (l *Loop) Rewind(n int) (string, error) {\n\tif n < 1 {\n'
        new = 'func (l *Loop) Rewind(n int) (string, error) {\n\tif !l.historyMu.TryLock() {\n\t\treturn "", ErrHistoryMutationInProgress\n\t}\n\tdefer l.historyMu.Unlock()\n\n\tif n < 1 {\n'
        if old not in s: raise SystemExit('Rewind entry anchor missing')
        p.write_text(s.replace(old, new, 1))
        PY
        gofmt -w internal/agent
        git fetch origin master
        git checkout origin/master -- .github/workflows/ci.yml
        rm -f .github/workflows/apply-finding5.yml
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add -A
        git commit -m 'fix(agent): serialize compact and rewind history mutations'
        git push origin HEAD:fix/compact-command-interlock

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.1'
        check-latest: true

    - name: Environment diagnostics
      run: go env GOOS GOARCH CGO_ENABLED CC

    - name: Check formatting (gofmt)
      run: test -z "$(gofmt -l .)"

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Unit tests without race
      run: go test ./... -count=1

    - name: Nested bubbles unit tests
      working-directory: third_party/bubbles
      run: go test ./... -count=1

    - name: Install pinned staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
        export PATH="$(go env GOPATH)/bin:$PATH"
        staticcheck -version
        staticcheck ./...

    - name: Race detector on all packages
      run: go test ./... -race -count=1

    - name: Nested bubbles race tests
      working-directory: third_party/bubbles
      run: go test ./... -race -count=1

    - name: Router intensive race test
      run: go test ./internal/provider/... -run Router -race -count=100

    - name: Agent intensive race test
      run: go test ./internal/agent/... -run 'Router|Replay|Messages|ToolCall|Compact' -race -count=50

    - name: UI and Presentation intensive race test
      run: go test ./internal/ui/... ./internal/presentation/... -race -count=20

    - name: UI row-accounting contract test
      run: go test ./internal/ui/ -run 'Contract|RowAccounting|FrameHeight|BottomAnchor' -count=1

    - name: UI rendering and streaming benchmarks
      run: go test ./internal/ui/ -run '^$' -bench '^(BenchmarkRefreshStreaming|BenchmarkFormatInlineLong|BenchmarkFormatMarkdown|BenchmarkViewFullScreen)$' -benchmem -count=1

    - name: Exec.Cmd.Env static audit
      run: bash scripts/check-exec-env.sh

    - name: Git diff check
      run: git diff --check

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, vet: true}
          - {goos: linux, goarch: arm64, vet: true}
          - {goos: darwin, goarch: amd64, vet: true}
          - {goos: darwin, goarch: arm64, vet: true}
          - {goos: android, goarch: arm64, vet: true}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.1'
        check-latest: true
    - name: Cross-compile
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go build ./...
    - name: Vet
      if: ${{ matrix.vet }}
      env:
        CGO_ENABLED: "0"
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: go vet ./...
