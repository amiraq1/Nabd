name: CI

on:
  push:
    branches: ["fix/config-v1-hardening"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/config-v1-hardening
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cmd/ag/main.go')
          s = p.read_text()
          anchor = '''func main() {
\t// NOTE: no legacy ~/.ag/env loading here.'''
          replacement = '''func main() {
\tif len(os.Args) > 1 && os.Args[1] == "config" {
\t\tos.Exit(runConfigCommand(os.Args[2:], os.Stdout, os.Stderr))
\t}

\t// NOTE: no legacy ~/.ag/env loading here.'''
          if anchor not in s:
              raise SystemExit('main hook anchor missing')
          p.write_text(s.replace(anchor, replacement, 1))

          p = Path('internal/config/config.go')
          s = p.read_text()
          old = '''\t\tif errors.Is(err, bufio.ErrTooLong) || strings.Contains(err.Error(), "token too long") {'''
          new = '''\t\tif strings.Contains(err.Error(), "token too long") {'''
          if old not in s:
              raise SystemExit('scanner error anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('docs/THREAT_MODEL.md')
          s = p.read_text()
          s = s.replace(
            '| Provider API keys | `~/.ag/config` (preferred) or process environment (fallback). The binary never writes the file. |',
            '| Provider configuration and API keys | User-scoped absolute `NABD_CONFIG` path or `~/.ag/config`; process environment is fallback only when the file is absent or valid. Project files are never consulted. The binary never writes the file. |', 1)
          s = s.replace(
            '| Config TOCTOU | REDUCED | `Lstat` then `Open`. Symlink at Lstat time is refused. Swap after Lstat is a same-uid race |',
            '| Config TOCTOU | REDUCED | Unix opens the final component with `O_NOFOLLOW` and validates `fstat` metadata. Parent-directory symlink resolution remains a same-uid residual, including on Termux. |', 1)
          s = s.replace(
            '- `Lstat` first: symlink refused, non-regular refused, `mode & 0o077 != 0`\n  refused, Unix owner must equal `Getuid()` (`owner_unix.go`). Windows\n  ownership check is a no-op (`owner_other.go`).\n- Then `os.Open` of the same path. Residual TOCTOU as above.',
            '- Unix opens the final path component with `O_NOFOLLOW|O_CLOEXEC`, then validates regular-file type, `mode & 0o077 == 0`, owner and size from the opened descriptor.\n- Windows refuses a pre-open symlink and requires pre/post-open metadata to identify the same file; ownership remains a documented no-op (`owner_other.go`).\n- Parent-directory symlink resolution is the remaining same-uid TOCTOU boundary.', 1)
          p.write_text(s)
          PY
          gofmt -w internal/config cmd/ag/config_command.go cmd/ag/config_command_test.go
          git fetch origin master
          git checkout origin/master -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(config): add safe v1 operator commands'
          git push origin HEAD:fix/config-v1-hardening
          # triggered after PR creation
