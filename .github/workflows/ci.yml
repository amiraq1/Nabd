name: CI

on:
  push:
    branches: [ "master", "main", "feature/**", "fix/**", "docs/**", "ci/**" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  module-tidiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go mod tidy -diff
      - run: go mod tidy -diff
        working-directory: third_party/bubbles

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.1'
    - name: Environment diagnostics
      run: go env GOOS GOARCH CGO_ENABLED CC
    - name: Threat model freshness guard tests
      run: bash scripts/test-threat-model-freshness.sh
    - name: Threat model freshness
      if: github.event_name == 'pull_request'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: bash scripts/check-threat-model-freshness.sh "$BASE_SHA"
    - name: Threat model test citations
      run: bash scripts/check-threat-model-tests.sh
    - name: Check formatting (gofmt)
      run: test -z "$(gofmt -l .)"
    - name: Build
      run: go build ./...
    - name: Vet
      run: go vet ./...
    - name: Unit tests without race
      run: go test ./... -count=1
    - name: Nested bubbles unit tests
      working-directory: third_party/bubbles
      run: go test ./... -count=1
    - name: Install pinned staticcheck
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
        export PATH="$(go env GOPATH)/bin:$PATH"
        staticcheck -version
        staticcheck ./...
    - name: Race detector on all packages
      run: go test ./... -race -count=1
    - name: RTL engine race tests
      run: go test -race -count=1 ./internal/rtl/...
    - name: RTL Unicode conformance gates
      run: go run ./cmd/rtlconformance --unicode internal/rtl/testdata/unicode/17.0.0
    - name: Nested bubbles race tests
      working-directory: third_party/bubbles
      run: go test ./... -race -count=1
    - name: Router intensive race test
      run: go test ./internal/provider/... -run Router -race -count=100
    - name: Agent intensive race test
      run: go test ./internal/agent/... -run 'Router|Replay|Messages|ToolCall|Compact' -race -count=50
    - name: UI and Presentation intensive race test
      run: go test ./internal/ui/... ./internal/presentation/... -race -count=20
    - name: UI row-accounting contract test
      run: go test ./internal/ui/ -run 'Contract|RowAccounting|FrameHeight|BottomAnchor' -count=1
    - name: UI rendering and streaming benchmarks
      run: go test ./internal/ui/ -run '^$' -bench '^(BenchmarkRefreshStreaming|BenchmarkRefreshLiveStreaming|BenchmarkFormatInlineLong|BenchmarkFormatMarkdown|BenchmarkViewFullScreen)$' -benchmem -count=1
    - name: UI layout benchmark baseline (non-gating)
      continue-on-error: true
      shell: bash
      run: |
        set -o pipefail
        go test ./internal/ui/ -run '^$' -bench '^(BenchmarkRenderItems500|BenchmarkFormatInlineLong|BenchmarkFormatMarkdownLong|BenchmarkViewFullScreen)$' -benchmem -benchtime=10x -count=5 2>&1 | tee bench-ui.txt
    - name: Upload benchmark artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bench-ui-${{ github.sha }}
        path: bench-ui.txt
        if-no-files-found: warn
    - name: Exec.Cmd.Env static audit
      run: bash scripts/check-exec-env.sh
    - name: Security invariants static audit
      run: bash scripts/check-security-invariants.sh
    - name: Git diff check
      run: git diff --check
    - name: Clean local clone verification
      run: |
        tmp=$(mktemp -d)
        git clone --no-local . "$tmp/nabd"
        cd "$tmp/nabd"
        go build ./...
        go test ./... -race -count=1
        rm -rf "$tmp"

  release-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Extract notes for the next release
        run: |
          v=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | cut -c4-)
          test -n "$v"
          bash scripts/release-notes.sh "$v" > "${RUNNER_TEMP}/release-notes.md"
      - name: Assert clean tree
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: Snapshot release, no publish, no sign
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: release --clean --snapshot --skip=publish,sign,announce --release-notes=${{ runner.temp }}/release-notes.md
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.5"
      - name: Exercise the release signing step with an ephemeral key
        # The real release signs keylessly via goreleaser's signs: block
        # (cosign sign-blob --yes ... dist/checksums.txt). That block is
        # skipped in dry-run, so a broken cosign setup would only surface on
        # release day. This step runs the same command shape against the
        # snapshot checksums with a throwaway keypair that never leaves
        # RUNNER_TEMP: it proves cosign installs, the flags are valid, and
        # the artifact exists — without touching keyless OIDC or publishing
        # anything.
        env:
          COSIGN_PASSWORD: ""
        shell: bash
        run: |
          set -euo pipefail
          key_prefix="${RUNNER_TEMP}/dryrun-cosign"
          cosign generate-key-pair --output-key-prefix "$key_prefix"
          cosign sign-blob --yes --key "$key_prefix.key" \
            --output-certificate "$key_prefix.pem" \
            --output-signature "$key_prefix.sig" \
            dist/checksums.txt
          cosign verify-blob --key "$key_prefix.pub" \
            --signature "$key_prefix.sig" \
            dist/checksums.txt
          echo "signing step exercised OK"
      - name: Assert one distinct SBOM per binary, all checksummed
        shell: bash
        run: |
          shopt -s nullglob
          sboms=(dist/*.sbom.json)
          n=${#sboms[@]}
          test "$n" -eq 1 || { ls -la dist; echo "expected 1 SBOM, got $n"; exit 1; }
          test "$(grep -c 'sbom\.json' dist/checksums.txt)" -eq 1
          unique=$(printf '%s\n' "${sboms[@]}" | sed 's#^.*/##' | sort -u | wc -l)
          test "$unique" -eq 1 || { printf '%s\n' "${sboms[@]}"; echo "expected 1 distinct SBOM name, got $unique"; exit 1; }
          echo "SBOM coverage verified"
      - name: Upload dryrun binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nabd-dryrun-android-arm64
          path: dist/nabd_android_arm64*/nabd


  termux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.1'
    - name: Build and vet for Termux (android/arm64)
      env:
        CGO_ENABLED: "0"
        GOOS: android
        GOARCH: arm64
      run: |
        go build -o nabd-android-arm64 ./cmd/ag
        go build ./...
        go vet ./...
        go test -c -o /dev/null ./...   # compile tests for android, don't run
    - name: Upload Termux binary
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nabd-upstream-android-arm64
        path: nabd-android-arm64

