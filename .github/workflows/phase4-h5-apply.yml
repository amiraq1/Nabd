name: Apply phase 4 H5
on:
  push:
    branches: [ci/phase4-windows-compile-only]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ci/phase4-windows-compile-only
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Apply and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          note = '// Windows compatibility shim: compile-tested in CI; Windows remains an unsupported runtime target.\n'
          for name in ['internal/snap/rename_windows.go','internal/snap/sync_windows.go','internal/config/open_windows.go','internal/config/owner_other.go']:
            p=Path(name); s=p.read_text(); marker=s.find('\n\n')
            if note not in s: p.write_text(s[:marker+2]+note+s[marker+2:])
          p=Path('.github/workflows/ci.yml'); s=p.read_text(); marker='          - { goos: android, goarch: arm64, vet: true }'
          if 'goos: windows' not in s: s=s.replace(marker, marker+'\n          - { goos: windows, goarch: amd64, vet: false }',1)
          p.write_text(s)
          PY
          gofmt -w internal/snap/*_windows.go internal/config/open_windows.go internal/config/owner_other.go
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml internal/snap/rename_windows.go internal/snap/sync_windows.go internal/config/open_windows.go internal/config/owner_other.go
          git commit -m "ci: compile-test unsupported Windows shims"
          git push origin HEAD:ci/phase4-windows-compile-only
