name: Apply phase 4 hygiene v4
on:
  push:
    branches: [chore/phase4-code-hygiene]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/phase4-code-hygiene
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Apply and commit
        run: |
          sed -i 's/KNOWN_LIMITATION_CIRCUIT_BREAKER: NOT_IMPLEMENTED (P section)/KNOWN_LIMITATION_CIRCUIT_BREAKER: NOT_IMPLEMENTED/' scripts/apply_phase4.py
          python3 scripts/apply_phase4.py
          rm -f .github/workflows/phase4-apply-v4.yml
          gofmt -w internal/tools internal/provider/router.go internal/snap/*_windows.go internal/config/open_windows.go internal/config/owner_other.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: complete phase 4 code hygiene"
          git push origin HEAD:chore/phase4-code-hygiene
