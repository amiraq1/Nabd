name: Apply phase 4 H3
on:
  push:
    branches: [fix/phase4-directory-modes]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/phase4-directory-modes
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Apply and test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/tools/write_commit.go')
          s=p.read_text()
          s=s.replace('\t"path/filepath"\n','',1)
          s=s.replace('if err := os.MkdirAll(filepath.Dir(abs), 0o755); err != nil {','if err := mkdirParentDirs(abs); err != nil {',1)
          p.write_text(s)
          PY
          cat > internal/tools/mkdir_mode.go <<'EOF'
          package tools

          import (
            "fmt"
            "os"
            "path/filepath"
          )

          // mkdirParentDirs creates missing directories with the nearest existing
          // ancestor's permission bits. The 0755 fallback is reachable only when
          // no usable existing ancestor can be found.
          func mkdirParentDirs(abs string) error {
            target := filepath.Dir(abs)
            if fi, err := os.Stat(target); err == nil {
              if !fi.IsDir() { return fmt.Errorf("parent is not a directory: %s", target) }
              return nil
            } else if !os.IsNotExist(err) { return err }

            ancestor := target
            for {
              parent := filepath.Dir(ancestor)
              fi, err := os.Stat(parent)
              if err == nil {
                if !fi.IsDir() { return fmt.Errorf("ancestor is not a directory: %s", parent) }
                mode := fi.Mode().Perm()
                if mode == 0 { mode = 0o755 }
                return os.MkdirAll(target, mode)
              }
              if !os.IsNotExist(err) { return err }
              if parent == ancestor { return os.MkdirAll(target, 0o755) }
              ancestor = parent
            }
          }
          EOF
          cat > internal/tools/mkdir_mode_test.go <<'EOF'
          package tools

          import (
            "os"
            "path/filepath"
            "testing"
          )

          func TestMkdirParentDirsInheritsPrivateAncestorMode(t *testing.T) {
            root := t.TempDir()
            private := filepath.Join(root, "private")
            if err := os.Mkdir(private, 0o700); err != nil { t.Fatal(err) }
            target := filepath.Join(private, "one", "two", "file.txt")
            if err := mkdirParentDirs(target); err != nil { t.Fatal(err) }
            for _, dir := range []string{filepath.Join(private, "one"), filepath.Join(private, "one", "two")} {
              fi, err := os.Stat(dir)
              if err != nil { t.Fatal(err) }
              if got := fi.Mode().Perm(); got != 0o700 { t.Fatalf("%s mode = %04o, want 0700", dir, got) }
            }
          }
          EOF
          cat >> docs/THREAT_MODEL.md <<'EOF'

          ### Inherited directory permissions

          Write tools create missing parent directories with the permission bits of the nearest existing ancestor. This prevents a private `0700` project subtree from silently gaining `0755` descendants; `0755` is retained only as a documented root-level fallback when no usable ancestor exists.
          EOF
          gofmt -w internal/tools/write_commit.go internal/tools/mkdir_mode.go internal/tools/mkdir_mode_test.go
          go test ./internal/tools -run MkdirParentDirs -count=1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/tools/write_commit.go internal/tools/mkdir_mode.go internal/tools/mkdir_mode_test.go docs/THREAT_MODEL.md
          git commit -m "fix(tools): inherit parent directory permissions"
          git push origin HEAD:fix/phase4-directory-modes
