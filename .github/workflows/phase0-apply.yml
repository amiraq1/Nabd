name: Apply phase 0
on:
  push:
    branches: ["docs/phase-0-freshness"]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'amiraq1' && !contains(github.event.head_commit.message, '[phase0-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify branch write
        run: |
          printf 'ready\n' > .phase0-ready
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .phase0-ready
          git commit -m 'chore: verify phase workflow [phase0-applied]'
          git push
