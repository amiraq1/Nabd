name: Apply phase 0
on:
  push:
    branches: ["docs/phase-0-freshness"]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor == 'amiraq1' && !contains(github.event.head_commit.message, '[phase0-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply reviewed phase 0 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('README.md'); s = p.read_text()
          pattern = r'\*\*No GitHub Release has been published yet:\*\*.*?See `docs/RELEASING\.md`\.\n'
          replacement = """Published releases are available on the [Releases page](https://github.com/amiraq1/Nabd/releases):

          | Release | Published | Assets |
          |---|---|---|
          | `v1.4.0` | 2026-09-11 | Platform binaries and `checksums.txt` |
          | `v1.3.0` | 2026-09-11 | Platform binaries and `checksums.txt` |

          Verify a downloaded release from its directory:

          ```sh
          sha256sum -c checksums.txt
          ```

          See `docs/RELEASING.md` for the release process.
          """
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1: raise SystemExit('README release block not found')
          p.write_text(s)

          p = Path('SECURITY.md'); s = p.read_text()
          s, n = re.subn(r'Only the latest tagged release is supported\. Older tags, including `v1\.2\.0`\nand earlier, receive no backports\.\n', 'Only the latest tagged release is supported. Older tagged releases receive no\nbackports.\n', s, count=1)
          if n != 1: raise SystemExit('SECURITY version block not found')
          p.write_text(s)

          p = Path('docs/THREAT_MODEL.md'); s = p.read_text()
          s, n = re.subn(r'Sourced from the code as of commit d63da42.*?code\), not from intention\.\n', 'Sourced from the code at `master` commit `7d9e2f07f9561d4e79b2db6164387b3eac6660ff`, not from intention.\nLast reviewed: 2026-09-12 · `7d9e2f07f9561d4e79b2db6164387b3eac6660ff`.\n', s, count=1, flags=re.S)
          if n != 1: raise SystemExit('THREAT_MODEL provenance block not found')
          p.write_text(s)

          p = Path('.github/workflows/ci.yml'); s = p.read_text()
          anchor = "    - name: Environment diagnostics\n      run: go env GOOS GOARCH CGO_ENABLED CC\n"
          step = """

              - name: Threat model freshness
                if: github.event_name == 'pull_request'
                run: |
                  base=${{ github.event.pull_request.base.sha }}
                  sec=$(git diff --name-only "$base" HEAD -- \\
                    internal/tools/path.go internal/tools/bash.go internal/perm/policy.go \\
                    internal/config/config.go internal/snap/shadow.go internal/agent/fence.go \\
                    cmd/ag/main.go)
                  doc=$(git diff --name-only "$base" HEAD -- docs/THREAT_MODEL.md)
                  if [ -n "$sec" ] && [ -z "$doc" ]; then
                    echo "security-relevant files changed without THREAT_MODEL.md update:"
                    echo "$sec"
                    exit 1
                  fi
          """
          if anchor not in s: raise SystemExit('CI insertion anchor not found')
          p.write_text(s.replace(anchor, anchor + step, 1))
          PY
          ! grep -qi 'no GitHub Release has been published' README.md
          ! grep -q 'd63da42' docs/THREAT_MODEL.md
          grep -q 'Threat model freshness' .github/workflows/ci.yml
          git diff --check
      - name: Commit phase 0
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md SECURITY.md docs/THREAT_MODEL.md .github/workflows/ci.yml
          git commit -m 'docs: refresh release and security claims [phase0-applied]'
          git push
