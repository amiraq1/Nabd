name: Apply diagnostics command
on:
  push:
    branches: [feat/ui-diagnostics-dashboard]
    paths: [.github/workflows/apply-diagnostics.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-diagnostics-dashboard
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/ui/slash_commands.go'); s=p.read_text()
          anchor='''\t{
\t\tName:        "/help",
\t\tUsage:       "/help",
\t\tDescription: "show supported slash commands",
\t\tHasArg:      false,
\t\tAllowBusy:   false,
\t},
'''
          diag='''\t{
\t\tName:        "/diag",
\t\tUsage:       "/diag",
\t\tDescription: "show privacy-safe UI metrics",
\t\tHasArg:      false,
\t\tAllowBusy:   false,
\t},
'''
          if anchor not in s: raise SystemExit('slash anchor missing')
          s=s.replace(anchor,diag+anchor,1); p.write_text(s)
          p=Path('internal/ui/feed_input.go'); s=p.read_text()
          anchor='''\tcase "/help":
\t\tm.composer.clear()
\t\tm.setCommandResult(CommandHelp(m.width))
\t\treturn m, nil
'''
          diag='''\tcase "/diag":
\t\tm.composer.clear()
\t\tm.setCommandResult(m.Diagnostics(m.width))
\t\treturn m, nil
'''
          if anchor not in s: raise SystemExit('handler anchor missing')
          s=s.replace(anchor,diag+anchor,1); p.write_text(s)
          PY
          gofmt -w internal/ui
          rm .github/workflows/apply-diagnostics.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git commit -m 'feat(ui): expose privacy-safe diagnostics command' && git push
