name: Format tool cards

on:
  push:
    branches:
      - feat/ui-tool-cards

permissions:
  contents: write

jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-tool-cards
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go files
        run: |
          gofmt -w \
            internal/presentation/item.go \
            internal/presentation/projector.go \
            internal/presentation/tool_card_test.go \
            internal/ui/feed_render.go \
            internal/ui/tool_summary.go \
            internal/ui/tool_summary_test.go
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/presentation internal/ui
          git commit -m 'style: gofmt tool card implementation'
          git push origin HEAD:feat/ui-tool-cards
