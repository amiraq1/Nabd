name: PR checklist

on:
  pull_request:
    branches: [ "master", "main" ]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch live PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.body // ""' > "$RUNNER_TEMP/pr-body"
      - name: Required PR security checklist
        env:
          LIVE_BODY_FILE: ${{ runner.temp }}/pr-body
        run: bash scripts/check-pr-security-checklist.sh
