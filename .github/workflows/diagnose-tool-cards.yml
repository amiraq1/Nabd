name: Fix tool card truncation contract

on:
  push:
    branches:
      - feat/ui-tool-cards

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ui-tool-cards
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Update legacy truncation test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/presentation/projector_test.go')
          text = path.read_text()
          old = '''\tif !tool.Tool.Truncated {
          \t\tt.Errorf("expected tool.Truncated to be true for real store marker %q", output)
          \t}
          '''
          new = '''\tif tool.Tool.Truncated {
          \t\tt.Errorf("execution truncation must not be inferred from the store marker %q", output)
          \t}
          \tif tool.Tool.OutputState != presentation.OutputTruncated {
          \t\tt.Errorf("OutputState = %q, want OutputTruncated", tool.Tool.OutputState)
          \t}
          '''
          if old not in text:
              raise SystemExit('legacy truncation assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          gofmt -w internal/presentation/projector_test.go
          go test ./internal/presentation ./internal/ui
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/presentation/projector_test.go
          git commit -m 'test: distinguish persisted and execution truncation'
          git push origin HEAD:feat/ui-tool-cards
