name: Phase 1 module tidy

on:
  push:
    branches: [ci/phase1-supply-chain]

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ci/phase1-supply-chain
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          check-latest: true
      - name: Tidy both modules
        run: |
          go mod tidy
          (cd third_party/bubbles && go mod tidy)
      - name: Commit generated module metadata
        run: |
          if git diff --quiet -- go.mod go.sum third_party/bubbles/go.mod third_party/bubbles/go.sum; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum third_party/bubbles/go.mod third_party/bubbles/go.sum
          git commit -m "chore: tidy Go modules"
          git push origin HEAD:ci/phase1-supply-chain
