name: Publish v1.4.0

on:
  push:
    branches:
      - release/v1.4.0
    paths:
      - .github/workflows/publish-v1.4.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Verify release commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1c341b3de8cfce4f9ae2927f0eb2050564c0654b"
          if git rev-parse "refs/tags/v1.4.0" >/dev/null 2>&1; then
            echo "v1.4.0 already exists"
            exit 1
          fi

      - name: Create release tag
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v1.4.0 -m "Nabd v1.4.0"
          git push origin refs/tags/v1.4.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          check-latest: true

      - name: Publish release artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
